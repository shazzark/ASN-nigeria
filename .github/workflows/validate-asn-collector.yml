name: Update Nigerian ASN and IP lists

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-asn-nigeria
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Restrict publication to main
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Refusing to publish from $GITHUB_REF; only main may publish data." >&2
            exit 1
          fi
      - name: Generate validated allocation and country-geolocation datasets
        run: npm run update
      - name: Summarize successful collection
        run: |
          node <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('node:fs');
          const registry = JSON.parse(fs.readFileSync('data/metadata.json', 'utf8'));
          const country = JSON.parse(fs.readFileSync('data/country-ip/metadata.json', 'utf8'));
          console.log('## Successful dataset check');
          console.log('Checked at (UTC): ' + new Date().toISOString());
          console.log('Registry counts: ' + JSON.stringify(registry.counts));
          console.log('Country-IP counts: ' + JSON.stringify(country.records));
          console.log('DB-IP release: ' + country.releaseMonth);
          console.log('A successful check does not create a commit when dataset records are unchanged.');
          NODE
      - name: Commit changed generated records
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git reset -- data/metadata.json data/country-ip/metadata.json
          if git diff --cached --quiet -- data; then
            echo "No published dataset records changed; skipping commit."
          else
            git add data/metadata.json data/country-ip/metadata.json
            git commit -m "Update Nigerian ASN and IP lists"
            git push
          fi
